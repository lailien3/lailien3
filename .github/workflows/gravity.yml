name: Contribution gravity
on:
  schedule:
    - cron: '0 0 * * *'
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gravity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: flycran/github-gravity@v1
        with:
          username: lailien3
          text: contributions
          output-path: deploy/gravity.svg
          background-color: transparent
          text-color: "#FF8896"
      - name: Crop top 25%
        run: |
          python3 - <<'PY'
          import re
          p = 'deploy/gravity.svg'
          s = open(p, encoding='utf-8').read()
          m = re.search(r'viewBox="0 0 ([\d.]+) ([\d.]+)"', s)
          w, h = float(m.group(1)), float(m.group(2))
          top, new_h = h * 0.25, h * 0.75
          head, rest = s.split('>', 1)
          head = re.sub(r'viewBox="[^"]*"', f'viewBox="0 {top:g} {w:g} {new_h:g}"', head)
          head = re.sub(r'height="[\d.]+"', f'height="{new_h:g}"', head)
          open(p, 'w', encoding='utf-8').write(head + '>' + rest)
          PY
          head -n 6 deploy/gravity.svg
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: output
          keep_files: false
          force_orphan: true
